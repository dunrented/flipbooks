<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Barbell Beats the Middle — Damon Nelson</title>
<style>body{margin:0;background:#222;font-family:sans-serif;color:#fff;display:flex;flex-direction:column;align-items:center}#book{margin:20px auto}.page img{width:100%;height:100%;display:block}.nav{margin:10px}button{font-size:16px;padding:8px 16px;margin:0 6px}a{color:#fff}</style></head><body>
<div id="book"></div>
<div class="nav"><button id="prev">&larr; Prev</button><span id="pg"></span><button id="next">Next &rarr;</button></div>
<p><a href="barbell.pdf">Download PDF</a></p>
<script src="page-flip.browser.js"></script>
<script>
const book=document.getElementById('book');
for(let i=1;i<=10;i++){const d=document.createElement('div');d.className='page';d.innerHTML='<img src="pages/p-'+String(i).padStart(2,'0')+'.jpg" alt="Page '+i+'">';book.appendChild(d);}
const pf=new St.PageFlip(book,{width:432,height:540,size:"stretch",minWidth:240,maxWidth:600,minHeight:300,maxHeight:750,showCover:true,mobileScrollSupport:false});
pf.loadFromHTML(document.querySelectorAll('.page'));
const u=()=>document.getElementById('pg').textContent=(pf.getCurrentPageIndex()+1)+' / '+pf.getPageCount();
pf.on('flip',u);u();
document.getElementById('prev').onclick=()=>pf.flipPrev();document.getElementById('next').onclick=()=>pf.flipNext();
</script></body></html>
